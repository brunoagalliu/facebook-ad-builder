repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.18.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: eslint
        name: ESLint (frontend)
        entry: bash -c 'cd frontend && npx eslint --fix'
        language: system
        files: ^frontend/src/.*\.(js|jsx|ts|tsx)$
        pass_filenames: true

      - id: eslint-backend-node
        name: ESLint (backend-node)
        entry: bash -c 'cd backend-node && npx eslint --fix'
        language: system
        files: ^backend-node/src/.*\.ts$
        pass_filenames: true

      - id: prettier-backend-node
        name: Prettier (backend-node)
        entry: bash -c 'cd backend-node && npx prettier --write'
        language: system
        files: ^backend-node/(src|prisma)/.*\.ts$
        pass_filenames: true
