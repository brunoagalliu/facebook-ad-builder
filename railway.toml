# Railway configuration for monorepo deployment

[build]
builder = "NIXPACKS"

# Frontend Service
[[services]]
name = "frontend"
source = "frontend"

[services.build]
builder = "NIXPACKS"

[services.deploy]
startCommand = "npm run preview -- --host 0.0.0.0 --port $PORT"

# Backend Service (Node.js/TypeScript — the Python "backend" service and backend/
# directory have been removed; this is now the only backend). Service is still named
# "backend-node" in Railway — rename the live service via the dashboard if desired,
# since editing this file alone does not rename an existing Railway service.
[[services]]
name = "backend-node"
source = "backend-node"

[services.build]
builder = "DOCKERFILE"
dockerfilePath = "backend-node/Dockerfile"

[services.deploy]
startCommand = "npx prisma migrate deploy && node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
